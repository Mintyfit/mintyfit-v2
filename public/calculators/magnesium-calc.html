<body>
    <div id="app"></div>

    <script>
        // ── State ────────────────────────────────────────────────────────────
        const state = {
            age: 30,
            sex: 'male',
            weight: 75,
            height: 175,
            selectedFood: 'regular_diet',
            foodAmount: 100,
            exerciseType: 'rest',
            exerciseDuration: 30,
            pregnancyStatus: 'none',
            digestiveHealth: 'good',
            stressLevel: 'moderate',
            alcoholType: 'none',
            numberOfDrinks: 0,
            drinkVolume: 150,
            drankYesterday: false,
            caffeineIntake: 'moderate',
            symptoms: {
                muscleCramps: false,
                fatigue: false,
                sleepIssues: false,
                eyeTwitches: false,
                anxiety: false,
                headaches: false,
                heartPalpitations: false
            },
            hasGIUpset: false
        };

        // ── Data tables ──────────────────────────────────────────────────────
        // Magnesium-rich foods (mg per 100g)
        const foods = {
            'none_fasting': { name: 'I didn\'t eat today (fasting)', mg: 0, absorption: 0 },
            'regular_diet': { name: 'No magnesium-rich foods (regular diet)', mg: 60, absorption: 0.25 },
            'spinach': { name: 'Spinach (cooked)', mg: 87, absorption: 0.30 },
            'pumpkin_seeds': { name: 'Pumpkin seeds', mg: 550, absorption: 0.40 },
            'almonds': { name: 'Almonds', mg: 270, absorption: 0.35 },
            'cashews': { name: 'Cashews', mg: 292, absorption: 0.35 },
            'black_beans': { name: 'Black beans (cooked)', mg: 70, absorption: 0.25 },
            'edamame': { name: 'Edamame', mg: 64, absorption: 0.28 },
            'peanut_butter': { name: 'Peanut butter', mg: 168, absorption: 0.32 },
            'brown_rice': { name: 'Brown rice (cooked)', mg: 44, absorption: 0.22 },
            'avocado': { name: 'Avocado', mg: 29, absorption: 0.35 },
            'dark_chocolate': { name: 'Dark chocolate (70-85%)', mg: 228, absorption: 0.38 },
            'quinoa': { name: 'Quinoa (cooked)', mg: 64, absorption: 0.26 },
            'tofu': { name: 'Tofu', mg: 53, absorption: 0.30 },
            'chia_seeds': { name: 'Chia seeds', mg: 335, absorption: 0.38 },
            'flaxseeds': { name: 'Flaxseeds', mg: 392, absorption: 0.36 },
            'brazil_nuts': { name: 'Brazil nuts', mg: 376, absorption: 0.34 },
            'salmon': { name: 'Salmon', mg: 29, absorption: 0.40 },
            'mackerel': { name: 'Mackerel', mg: 97, absorption: 0.42 },
            'banana': { name: 'Banana', mg: 27, absorption: 0.32 },
            'swiss_chard': { name: 'Swiss chard (cooked)', mg: 81, absorption: 0.28 },
            'kale': { name: 'Kale (cooked)', mg: 34, absorption: 0.27 }
        };

        // Exercise activities with MET values (Metabolic Equivalent of Task)
        // MET represents energy expenditure - higher MET = more sweat/magnesium loss
        const exercises = {
            'rest': { name: 'Rest day / No exercise', met: 0, intensity: 'rest' },
            'walking_casual': { name: 'Walking (casual, 3 km/h)', met: 2.5, intensity: 'light' },
            'walking_brisk': { name: 'Walking (brisk, 5-6 km/h)', met: 4.0, intensity: 'moderate' },
            'hiking': { name: 'Hiking', met: 6.0, intensity: 'moderate' },
            'jogging': { name: 'Jogging (light pace)', met: 6.0, intensity: 'moderate' },
            'running': { name: 'Running (8-10 km/h)', met: 8.0, intensity: 'vigorous' },
            'running_fast': { name: 'Running (>10 km/h)', met: 11.0, intensity: 'vigorous' },
            'cycling_leisure': { name: 'Cycling (leisure, <16 km/h)', met: 4.0, intensity: 'light' },
            'cycling_moderate': { name: 'Cycling (moderate, 16-19 km/h)', met: 6.8, intensity: 'moderate' },
            'cycling_vigorous': { name: 'Cycling (vigorous, >20 km/h)', met: 10.0, intensity: 'vigorous' },
            'swimming_leisure': { name: 'Swimming (leisure)', met: 6.0, intensity: 'moderate' },
            'swimming_laps': { name: 'Swimming (laps, vigorous)', met: 10.0, intensity: 'vigorous' },
            'yoga': { name: 'Yoga (Hatha)', met: 2.5, intensity: 'light' },
            'yoga_power': { name: 'Yoga (Power/Vinyasa)', met: 4.0, intensity: 'moderate' },
            'pilates': { name: 'Pilates', met: 3.0, intensity: 'light' },
            'weight_training': { name: 'Weight training (moderate)', met: 5.0, intensity: 'moderate' },
            'weight_training_vigorous': { name: 'Weight training (vigorous)', met: 6.0, intensity: 'vigorous' },
            'hiit': { name: 'HIIT / Circuit training', met: 8.0, intensity: 'vigorous' },
            'crossfit': { name: 'CrossFit', met: 9.0, intensity: 'vigorous' },
            'rowing': { name: 'Rowing machine', met: 7.0, intensity: 'vigorous' },
            'elliptical': { name: 'Elliptical trainer', met: 5.0, intensity: 'moderate' },
            'tennis': { name: 'Tennis (singles)', met: 8.0, intensity: 'vigorous' },
            'basketball': { name: 'Basketball (game)', met: 8.0, intensity: 'vigorous' },
            'soccer': { name: 'Soccer', met: 10.0, intensity: 'vigorous' },
            'dancing': { name: 'Dancing (general)', met: 4.5, intensity: 'moderate' },
            'martial_arts': { name: 'Martial arts', met: 10.0, intensity: 'vigorous' }
        };

        // Alcohol types with ABV (Alcohol By Volume) percentages
        const alcoholTypes = {
            'none': { name: 'No alcohol today', abv: 0 },
            'beer_light': { name: 'Light Beer', abv: 0.04 },
            'beer_regular': { name: 'Regular Beer', abv: 0.05 },
            'beer_craft': { name: 'Craft Beer / IPA', abv: 0.07 },
            'wine_red': { name: 'Red Wine', abv: 0.13 },
            'wine_white': { name: 'White Wine', abv: 0.12 },
            'wine_sparkling': { name: 'Sparkling Wine / Champagne', abv: 0.12 },
            'vodka': { name: 'Vodka', abv: 0.40 },
            'whiskey': { name: 'Whiskey / Bourbon', abv: 0.40 },
            'rum': { name: 'Rum', abv: 0.40 },
            'gin': { name: 'Gin', abv: 0.40 },
            'tequila': { name: 'Tequila', abv: 0.40 },
            'cocktail_light': { name: 'Light Cocktail (Mojito, Spritz)', abv: 0.10 },
            'cocktail_strong': { name: 'Strong Cocktail (Margarita, Old Fashioned)', abv: 0.20 }
        };

        // ── Icons (Lucide, inline SVG) ───────────────────────────────────────
        const ICONS = {
            calculator: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="14"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>',
            user: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            utensils: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
            pill: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>'
        };
        function icon(name, cls, color) {
            return ICONS[name].replace('<svg', '<svg class="' + cls + '" style="color:' + color + '"');
        }

        // ── State setters (globals used by inline handlers) ──────────────────
        function setNum(key, value) {
            state[key] = Number(value);
            render();
        }
        function setVal(key, value) {
            state[key] = value;
            // Clamp food amount when switching food categories
            if (key === 'selectedFood') {
                const max = value === 'regular_diet' ? 2000 : 200;
                if (state.foodAmount > max) state.foodAmount = max;
            }
            render();
        }
        function setBool(key, checked) {
            state[key] = checked;
            render();
        }
        function toggleSymptom(symptom) {
            state.symptoms[symptom] = !state.symptoms[symptom];
            render();
        }

        // ── Calculation logic ────────────────────────────────────────────────
        function calculateRDA() {
            let baseRDA;
            if (state.sex === 'male') {
                if (state.age >= 31) baseRDA = 420;
                else if (state.age >= 19) baseRDA = 400;
                else if (state.age >= 14) baseRDA = 410;
                else baseRDA = 240;
            } else {
                if (state.age >= 31) baseRDA = 320;
                else if (state.age >= 19) baseRDA = 310;
                else if (state.age >= 14) baseRDA = 360;
                else baseRDA = 240;

                // Adjust for pregnancy and lactation
                if (state.pregnancyStatus === 'pregnant') {
                    baseRDA = state.age >= 19 ? 350 : 400;
                } else if (state.pregnancyStatus === 'lactating') {
                    baseRDA = state.age >= 19 ? 310 : 360;
                }
            }
            return baseRDA;
        }

        // Magnesium loss from exercise: MET-based sweat rate × duration × Mg concentration
        function calculateExerciseMgLoss() {
            const exerciseData = exercises[state.exerciseType];
            if (exerciseData.met === 0) return 0;

            // Average sweat rate: 0.5-2.0 L/hour depending on intensity
            // Magnesium in sweat: ~0.2-0.5 mg/L (average ~0.35 mg/L)
            const durationHours = state.exerciseDuration / 60;
            let sweatRateLPerHour;
            if (exerciseData.intensity === 'light') sweatRateLPerHour = 0.5;
            else if (exerciseData.intensity === 'moderate') sweatRateLPerHour = 1.0;
            else sweatRateLPerHour = 1.5; // vigorous

            const totalSweatLiters = sweatRateLPerHour * durationHours;
            const mgLostInSweat = totalSweatLiters * 0.35; // 0.35 mg Mg per liter of sweat

            // Also account for increased urinary excretion during/after exercise
            const urinaryLoss = exerciseData.met * durationHours * 0.5;

            return mgLostInSweat + urinaryLoss;
        }

        // Magnesium loss from alcohol consumption
        function calculateAlcoholMgLoss() {
            let totalLoss = 0;

            // Today's alcohol consumption
            if (state.alcoholType !== 'none' && state.numberOfDrinks > 0) {
                const alcoholData = alcoholTypes[state.alcoholType];
                // volume(ml) × ABV × 0.789 (density of ethanol) = grams of ethanol
                const ethanolGrams = (state.drinkVolume * state.numberOfDrinks * alcoholData.abv * 0.789);
                // Research: ~2-3mg magnesium lost per 10g ethanol (increased urinary excretion)
                totalLoss += (ethanolGrams / 10) * 2.5;
            }

            // Yesterday's alcohol recovery penalty (continued excretion for 24-48 hours)
            if (state.drankYesterday) totalLoss += 15;

            return totalLoss;
        }

        function getCapsuleRecommendation(amount) {
            if (amount === 0) return null;
            if (amount <= 100) return '1 × 100mg capsule';
            if (amount <= 200) return '1 × 200mg capsule';
            if (amount <= 250) return '1 × 250mg capsule';
            if (amount <= 300) return '1 × 300mg capsule';
            if (amount <= 400) return '2 × 200mg capsules';
            if (amount <= 500) return '2 × 250mg capsules';
            if (amount <= 600) return '3 × 200mg capsules';
            if (amount <= 800) return '4 × 200mg capsules';
            if (amount <= 1000) return '5 × 200mg capsules';
            return Math.ceil(amount / 200) + ' × 200mg capsules';
        }

        function computeAll() {
            const heightM = state.height / 100;
            const bmi = state.weight / (heightM * heightM);

            const foodData = foods[state.selectedFood];
            const totalMgInFood = (foodData.mg * state.foodAmount) / 100;

            // Absorption rate modifiers
            const digestiveModifier = { 'excellent': 1.1, 'good': 1.0, 'fair': 0.85, 'poor': 0.65, 'ibd': 0.50 };
            const stressModifier = { 'low': 1.05, 'moderate': 1.0, 'high': 0.90, 'very_high': 0.80 };
            const caffeineModifier = { 'none': 1.05, 'low': 1.0, 'moderate': 0.95, 'high': 0.85 };

            let absorptionModifier = 1.0;
            absorptionModifier *= digestiveModifier[state.digestiveHealth];
            absorptionModifier *= stressModifier[state.stressLevel];
            absorptionModifier *= caffeineModifier[state.caffeineIntake];

            const adjustedAbsorption = foodData.absorption * absorptionModifier;
            const absorbedMgFromFood = totalMgInFood * adjustedAbsorption;

            const exerciseMgLoss = calculateExerciseMgLoss();
            const alcoholMgLoss = calculateAlcoholMgLoss();

            const rda = calculateRDA();
            const totalMgNeeded = rda + exerciseMgLoss + alcoholMgLoss;
            const deficit = Math.max(0, totalMgNeeded - absorbedMgFromFood);

            // Magnesium glycinate: ~80% absorption, dose rounded to nearest 50mg
            const elementalMgInSupplement = deficit / 0.80;
            const roundedGlycinate = Math.round(elementalMgInSupplement / 50) * 50;

            const percentRDA = (absorbedMgFromFood / totalMgNeeded) * 100;

            const symptomCount = Object.values(state.symptoms).filter(Boolean).length;
            let symptomFeedback;
            if (symptomCount <= 1) {
                symptomFeedback = { message: '✓ Low likelihood of deficiency', cls: 'fb-green' };
            } else if (symptomCount <= 3) {
                symptomFeedback = { message: '⚠️ Possible deficiency - pay attention to your supplement recommendation', cls: 'fb-yellow' };
            } else if (symptomCount <= 5) {
                symptomFeedback = { message: '⚠️ Moderate signs of deficiency - consider medical testing', cls: 'fb-orange' };
            } else {
                symptomFeedback = { message: '🚨 Strong indicators of deficiency - consult healthcare provider', cls: 'fb-red' };
            }

            return { bmi, foodData, totalMgInFood, absorptionModifier, adjustedAbsorption, absorbedMgFromFood, exerciseMgLoss, alcoholMgLoss, totalMgNeeded, deficit, roundedGlycinate, percentRDA, symptomCount, symptomFeedback };
        }

        // ── Render ───────────────────────────────────────────────────────────
        function render() {

                ['Spirits', ['vodka', ' (40% ABV)'], ['whiskey', ' (40% ABV)'], ['rum', ' (40% ABV)'], ['gin', ' (40% ABV)'], ['tequila', ' (40% ABV)']],

                (s.drankYesterday && s.alcoholType !== 'none' && s.numberOfDrinks > 0 ? ' + ' : '') +

            document.getElementById('app').innerHTML = `
<div class="calc-wrap">

        <div>

            <option value="high"${s.stressLevel === 'high' ? ' selected' : ''}>High</option>

          <p class="hint">Increases Mg excretion</p>
        </div>
        <div>
          <label class="lbl">Alcohol Type</label>
          <select class="select" onchange="setVal('alcoholType', this.value)">${alcoholOptions}</select>

        <div>

          <input type="range" class="range-orange" min="50" max="500" step="50" value="${s.drinkVolume}"${noAlcohol ? ' disabled' : ''}
            oninput="document.getElementById('vol-val').textContent = this.value"
            onchange="setNum('drinkVolume', this.value)">
          <p class="hint">${noAlcohol ? 'No alcohol selected' : 'Total: ' + (s.numberOfDrinks * s.drinkVolume) + 'ml'}</p>
        </div>
        <div>
          <label class="check-row">
            <input type="checkbox"${s.drankYesterday ? ' checked' : ''} onchange="setBool('drankYesterday', this.checked)">
            <span>I drank alcohol yesterday</span>
          </label>
          <p class="hint">Adds recovery penalty (+15mg)</p>
        </div>
        <div>
          <label class="lbl">Caffeine Intake</label>
          <select class="select" onchange="setVal('caffeineIntake', this.value)">
            <option value="none"${s.caffeineIntake === 'none' ? ' selected' : ''}>None</option>
            <option value="low"${s.caffeineIntake === 'low' ? ' selected' : ''}>Low (1 cup coffee/day)</option>
            <option value="moderate"${s.caffeineIntake === 'moderate' ? ' selected' : ''}>Moderate (2-3 cups/day)</option>
            <option value="high"${s.caffeineIntake === 'high' ? ' selected' : ''}>High (4+ cups/day)</option>
          </select>
          <p class="hint">Increases urinary loss</p>
        </div>
      </div>
      <div class="info-box ib-orange">
        <p><strong>Absorption efficiency:</strong> ${(c.absorptionModifier * 100).toFixed(0)}% of baseline
          ${c.absorptionModifier < 0.9 ? '<span class="text-accent"> ⚠️ Reduced due to lifestyle factors</span>' : ''}
          ${c.absorptionModifier > 1.0 ? '<span class="text-good"> ✓ Enhanced by favorable conditions</span>' : ''}
        </p>
        ${c.exerciseMgLoss > 0 ? `<p><strong>Exercise magnesium loss:</strong> ${c.exerciseMgLoss.toFixed(1)}mg <span class="text-accent"> (from sweat and increased metabolism)</span></p>` : ''}
        ${c.alcoholMgLoss > 0 ? `<p><strong>Alcohol magnesium loss:</strong> ${c.alcoholMgLoss.toFixed(1)}mg <span class="text-accent"> (${alcoholLossDetail})</span></p>` : ''}
      </div>
    </div>

    <!-- Symptom Checker -->
    <div class="sec">
      <div class="sec-head">
        ${icon('user', 'ic-sm', 'var(--purple-600)')}
        <h2>Magnesium Deficiency Symptom Checker</h2>
      </div>
      <div class="info-box ib-purple" style="margin-top:0;padding:1rem;">
        <p style="margin-bottom:1rem;">Check symptoms you're currently experiencing:</p>
        <div class="check-grid">${symptomCheckboxes}</div>
        <div class="feedback ${c.symptomFeedback.cls}">
          <p><strong>Symptoms checked: ${c.symptomCount} of 7</strong></p>
          <p>${c.symptomFeedback.message}</p>
        </div>
        <div class="divider">
          <label class="check-row" style="align-items:flex-start;">
            <input type="checkbox" style="margin-top:0.125rem;"${s.hasGIUpset ? ' checked' : ''} onchange="setBool('hasGIUpset', this.checked)">
            <span><strong>Experiencing diarrhea / GI upset from magnesium supplements</strong>
              ${s.hasGIUpset ? '<p class="small-warn">⚠️ You may be taking too much. Try reducing your dose or splitting it into smaller amounts throughout the day.</p>' : ''}
            </span>
          </label>
        </div>
      </div>
    </div>

    <!-- Food Selection -->
    <div class="sec">
      <div class="sec-head">
        ${icon('utensils', 'ic-sm', 'var(--green-600)')}
        <h2>Magnesium-Rich Food Intake</h2>
      </div>
      <div class="grid2">
        <div>
          <label class="lbl">Select Food</label>
          <select class="select" onchange="setVal('selectedFood', this.value)">${foodOptions}</select>
        </div>
        <div>
          <label class="lbl">${isFasting ? 'Amount: 0g (fasting)' : isRegular ? 'Amount of regular food: <span id="amt-val">' + s.foodAmount + '</span>g' : 'Amount: <span id="amt-val">' + s.foodAmount + '</span>g'}</label>
          <input type="range" class="range-green" min="0" max="${isRegular ? 2000 : 200}" step="${isRegular ? 100 : 1}" value="${s.foodAmount}"${isFasting ? ' disabled' : ''}
            oninput="var el = document.getElementById('amt-val'); if (el) el.textContent = this.value"
            onchange="setNum('foodAmount', this.value)">

        </div>
      </div>
      <div class="info-box ib-green" style="padding:1rem;">
        ${isFasting
          ? '<p><strong>No food intake today (fasting):</strong> 0mg magnesium</p>'
          : `<p><strong>Total magnesium in food:</strong> ${c.totalMgInFood.toFixed(1)}mg</p>
             <p><strong>Base absorption rate:</strong> ${(c.foodData.absorption * 100).toFixed(0)}%</p>
             <p><strong>Adjusted absorption rate:</strong> ${(c.adjustedAbsorption * 100).toFixed(1)}%</p>
             <p><strong>Absorbed magnesium:</strong> ${c.absorbedMgFromFood.toFixed(1)}mg</p>`}
      </div>
    </div>

    <!-- Results -->
    <div class="mb6">
      <div class="sec-head">
        ${icon('pill', 'ic-sm', 'var(--purple-600)')}
        <h2>Personalized Recommendations</h2>
      </div>
      <div class="result-food">
        <h3>From Food Intake</h3>
        <p class="big">${c.absorbedMgFromFood.toFixed(1)}mg</p>
        <p class="hint mt2">${c.percentRDA.toFixed(1)}% of your daily need (${c.totalMgNeeded.toFixed(0)}mg total)</p>
      </div>
    </div>

    <!-- Supplement Recommendation -->
    <div class="supp-box">
      <h3>Magnesium Glycinate Supplement Recommendation</h3>
      ${c.deficit > 0 ? `
        <div class="supp-row">
          <p>Daily magnesium deficit</p>
          <p class="big">${c.deficit.toFixed(1)}mg</p>
        </div>
        <div class="supp-hero">
          <p>Recommended Magnesium Glycinate</p>
          <p class="big">${c.roundedGlycinate}mg per day</p>
          <p class="mt2">💊 Take as: ${getCapsuleRecommendation(c.roundedGlycinate)}</p>
        </div>
        <div class="info-box ib-blue" style="margin-top:0;margin-bottom:0.75rem;border:1px solid var(--blue-200);">
          <p style="font-size:15px;">ℹ️ <strong>Why ${c.roundedGlycinate}mg?</strong> With 80% absorption, this provides ~${(c.roundedGlycinate * 0.80).toFixed(0)}mg of absorbable magnesium to cover your ${c.deficit.toFixed(1)}mg deficit.</p>
        </div>
        <div class="info-box ib-yellow" style="margin-top:0;">
          <p style="font-size:15px;"><strong>Note:</strong> Magnesium glycinate has ~80% absorption rate and is gentle on the stomach.
          For best results, split larger doses throughout the day (e.g., morning and evening).
          Always consult with a healthcare provider before starting supplementation.</p>
        </div>
      ` : `
        <div class="supp-ok">
          <p>🎉 Excellent! You're meeting your magnesium needs through diet alone.</p>
          <p>No supplementation needed at this food intake level.</p>
        </div>
      `}
    </div>

    <!-- Educational Note -->
    <div class="edu-box">
      <h4>Important Information</h4>
      <ul>
        <li>"Regular diet" provides ~60mg magnesium per 100g from common foods (bread, pasta, chicken, mixed vegetables)</li>
        <li>This calculator uses MET values and sweat rates to estimate exercise-based magnesium loss</li>
        <li>Exercise increases magnesium loss through sweat (0.35mg/L) and increased urinary excretion</li>
        <li>Alcohol depletes magnesium at approximately 2-3mg per 10g of ethanol consumed</li>
        <li>Alcohol's diuretic effect continues for 24-48 hours after consumption</li>
        <li>Vigorous exercise can increase daily magnesium needs by 10-20%</li>
        <li>Lifestyle factors (stress, caffeine, digestive health) affect absorption and retention</li>
        <li>Phytic acid in grains and legumes can reduce magnesium absorption</li>
        <li>Vitamin D, B6, and adequate protein intake support magnesium absorption</li>
        <li>Certain medications (PPIs, diuretics, antibiotics) can deplete magnesium</li>
        <li>Spread magnesium intake throughout the day for optimal absorption</li>
        <li>This calculator provides personalized estimates - consult healthcare providers for medical advice</li>
      </ul>
    </div>
  </div>
</div>`;
        }

        // Initial render
        try {
            render();
        } catch (error) {
            console.error('Error during initial render:', error);
            document.getElementById('app').innerHTML = '<div style="padding:2rem;background:#ffebee;border:2px solid #f44336;border-radius:8px;margin:2rem;"><h2 style="color:#c62828;">Calculator Error</h2><p>Something went wrong loading the calculator. Please refresh the page.</p></div>';
        }

        // ── Iframe auto-resize (parent listens for postMessage) ─────────────
        function sendHeight() {
            const height = document.documentElement.scrollHeight;
            window.parent.postMessage({ type: 'resize', height: height }, window.location.origin);
        }

        // Throttle resize messages to one per animation frame
        let heightRaf = 0;
        function scheduleSendHeight() {
            if (heightRaf) return;
            heightRaf = requestAnimationFrame(function() {
                heightRaf = 0;
                sendHeight();
            });
        }

        setTimeout(sendHeight, 100);
        setTimeout(sendHeight, 500);
        setTimeout(sendHeight, 1000);

        window.addEventListener('resize', scheduleSendHeight);

        const observer = new MutationObserver(scheduleSendHeight);
        observer.observe(document.body, { childList: true, subtree: true });
    </script>
