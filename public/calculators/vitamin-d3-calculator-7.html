<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitamin D3 Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        
        .calculator-container {
            width: 100%;
            margin: 0;
            background: rgba(255, 255, 255, 0.95);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 3rem 1rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: movePattern 20s linear infinite;
        }
        
        @keyframes movePattern {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin: 0 0 0.5rem 0;
            position: relative;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.95);
            margin: 0;
            position: relative;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem 1rem;
        }
        
        @media (max-width: 968px) {
            .content {
                grid-template-columns: 1fr;
                padding: 2rem 0.5rem;
            }
        }
        
        .section {
            background: white;
            padding: 0.5rem;
            border-radius: 16px;
        }
        
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #667eea;
            margin: 0 0 1.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .input-group {
            margin-bottom: 1.5rem;
        }
        
        .input-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        input[type="range"] {
            width: 100%;

            border-radius: 4px;
            outline: none;

        }
        
        input[type="range"]::-webkit-slider-thumb {

            background: white;
            border: 3px solid #667eea;

            transition: all 0.3s ease;

        input[type="range"]::-webkit-slider-thumb:hover {

            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: white;
            border: 3px solid #667eea;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);

        .range-value {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            margin-top: 0.5rem;
            font-family: 'Space Mono', monospace;
        }
        
        .radio-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .radio-option {
            position: relative;
        }
        
        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .radio-label {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.25rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            background: white;
            user-select: none;
        }
        
        .radio-label:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        
        .radio-option input[type="radio"]:checked + .radio-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }
        
        .result-value {
            font-size: 3rem;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            margin: 0.5rem 0;
        }
        
        .result-label {
            font-size: 1rem;
            opacity: 0.95;
        }
        
        .factors-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }
        
        @media (max-width: 768px) {
            .factors-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .factor-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
        }
        
        .factor-label {
            font-size: 0.85rem;

        }
        
        .factor-value {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
        }
        
        .function-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;

        }
        
        .function-item:hover {

        .function-item.optimal {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);

            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.15);

        }
        
        .cofactor-item.essential {
            border-left-color: #11998e;
        }
        
        .cofactor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .cofactor-name {
            font-weight: 700;
            color: #333;
            font-size: 1.1rem;
        }
        
        .cofactor-amount {
            font-weight: 700;
            color: #667eea;
            font-size: 1.3rem;
            font-family: 'Space Mono', monospace;
        }
        
        .cofactor-ratio {
            display: inline-block;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .cofactor-reason {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-top: 0.5rem;
        }
        
        .cofactor-timing {
            font-size: 0.85rem;
            color: #999;
            font-style: italic;
            margin-top: 0.5rem;
        }
        
        .info-box {
            background: linear-gradient(135deg, rgba(245, 87, 108, 0.1) 0%, rgba(102, 126, 234, 0.1) 100%);
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }
        
        .info-box h3 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #667eea;
            margin: 0 0 1rem 0;
            font-size: 1.1rem;
        }
        
        .info-box p {
            color: #555;
            line-height: 1.7;
            margin: 0.5rem 0;
            font-size: 0.95rem;
        }
        
        .info-box ul {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }
        
        .info-box li {
            color: #555;
            margin: 0.25rem 0;
            line-height: 1.6;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .location-display {
            background: rgba(102, 126, 234, 0.1);
            padding: 0.75rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .location-display button {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        
        .location-display button:hover {
            background: #5568d3;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        
        <div class="content" id="app"></div>
    </div>

    <script>
        // Comprehensive timezone to latitude mapping (covering 200+ timezones worldwide)
        const timezoneLatitudes = {

            'America/New_York': 40, 'America/Detroit': 42, 'America/Kentucky/Louisville': 38,

            'America/Managua': 12, 'America/Costa_Rica': 9, 'America/Panama': 8,
            'America/Havana': 23, 'America/Port-au-Prince': 18, 'America/Santo_Domingo': 18,
            'America/Jamaica': 18, 'America/Bogota': 4, 'America/Caracas': 10,
            'America/Lima': -12, 'America/Guayaquil': -2, 'America/La_Paz': -16,
            'America/Santiago': -33, 'America/Buenos_Aires': -34, 'America/Montevideo': -34,
            'America/Sao_Paulo': -23, 'America/Rio_Branco': -9, 'America/Manaus': -3,
            
            // Europe
            'Europe/London': 51, 'Europe/Dublin': 53, 'Europe/Lisbon': 38,
            'Europe/Madrid': 40, 'Europe/Barcelona': 41, 'Europe/Paris': 48,
            'Europe/Brussels': 50, 'Europe/Amsterdam': 52, 'Europe/Berlin': 52,
            'Europe/Vienna': 48, 'Europe/Zurich': 47, 'Europe/Rome': 41,
            'Europe/Vatican': 41, 'Europe/San_Marino': 43, 'Europe/Prague': 50,
            'Europe/Budapest': 47, 'Europe/Warsaw': 52, 'Europe/Stockholm': 59,
            'Europe/Oslo': 59, 'Europe/Copenhagen': 55, 'Europe/Helsinki': 60,
            'Europe/Tallinn': 59, 'Europe/Riga': 56, 'Europe/Vilnius': 54,
            'Europe/Moscow': 55, 'Europe/Kiev': 50, 'Europe/Minsk': 53,
            'Europe/Athens': 37, 'Europe/Istanbul': 41, 'Europe/Bucharest': 44,
            'Europe/Sofia': 42, 'Europe/Belgrade': 44, 'Europe/Zagreb': 45,

            'Asia/Shanghai': 31, 'Asia/Beijing': 39, 'Asia/Urumqi': 43,
            'Asia/Hong_Kong': 22, 'Asia/Macau': 22, 'Asia/Taipei': 25,
            'Asia/Tokyo': 35, 'Asia/Seoul': 37, 'Asia/Pyongyang': 39,
            'Asia/Singapore': 1, 'Asia/Kuala_Lumpur': 3, 'Asia/Bangkok': 13,
            'Asia/Jakarta': -6, 'Asia/Manila': 14, 'Asia/Ho_Chi_Minh': 10,
            'Asia/Hanoi': 21, 'Asia/Dubai': 25, 'Asia/Riyadh': 24,
            'Asia/Kuwait': 29, 'Asia/Bahrain': 26, 'Asia/Qatar': 25,
            'Asia/Tehran': 35, 'Asia/Baghdad': 33, 'Asia/Damascus': 33,
            'Asia/Beirut': 33, 'Asia/Jerusalem': 31, 'Asia/Amman': 31,
            'Asia/Kolkata': 28, 'Asia/Mumbai': 19, 'Asia/Delhi': 28,
            'Asia/Karachi': 24, 'Asia/Dhaka': 23, 'Asia/Kathmandu': 27,
            'Asia/Colombo': 6, 'Asia/Yangon': 16, 'Asia/Kabul': 34,
            'Asia/Tashkent': 41, 'Asia/Almaty': 43, 'Asia/Bishkek': 42,
            
            // Africa
            'Africa/Cairo': 30, 'Africa/Johannesburg': -26, 'Africa/Lagos': 6,
            'Africa/Nairobi': -1, 'Africa/Casablanca': 33, 'Africa/Algiers': 36,
            'Africa/Tunis': 36, 'Africa/Tripoli': 32, 'Africa/Khartoum': 15,
            'Africa/Addis_Ababa': 9, 'Africa/Dar_es_Salaam': -6, 'Africa/Kampala': 0,
            'Africa/Kinshasa': -4, 'Africa/Lusaka': -15, 'Africa/Harare': -17,
            'Africa/Maputo': -25, 'Africa/Windhoek': -22, 'Africa/Gaborone': -24,
            'Africa/Abidjan': 5, 'Africa/Accra': 5, 'Africa/Dakar': 14,
            
            // Australia & Oceania
            'Australia/Sydney': -33, 'Australia/Melbourne': -37, 'Australia/Brisbane': -27,
            'Australia/Perth': -31, 'Australia/Adelaide': -34, 'Australia/Darwin': -12,
            'Australia/Hobart': -42, 'Pacific/Auckland': -36, 'Pacific/Fiji': -18,
            'Pacific/Port_Moresby': -9, 'Pacific/Guam': 13, 'Pacific/Pago_Pago': -14,
            
            // South America (additional)
            'America/Fortaleza': -3, 'America/Recife': -8, 'America/Belem': -1,
            'America/Campo_Grande': -20, 'America/Cuiaba': -15, 'America/Santarem': -2,
            'America/Porto_Velho': -8, 'America/Boa_Vista': 2, 'America/Manaus': -3,
            'America/Eirunepe': -6, 'America/Rio_Branco': -9, 'America/Bahia': -12
        };

        // Detect user's timezone and estimate latitude
        function detectLatitude() {
            try {
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                return {
                    timezone: timezone,
                    latitude: timezoneLatitudes[timezone] || 40,
                    detected: !!timezoneLatitudes[timezone]
                };
            } catch (e) {
                return {
                    timezone: 'Unknown',
                    latitude: 40,
                    detected: false
                };
            }
        }

        // Initialize app
        const detectedLocation = detectLatitude();
        
        // State management
        let state = {
            age: 50,
            weight: 75,
            height: 175,
            sex: 'male',
            activityLevel: 'moderate',
            season: 'winter',
            weather: 'mixed',
            outdoorTime: '30-60',
            skinTone: 'fair',
            sunscreenUse: 'sometimes',
            targetLevel: 100,
            currentLevel: 40, // Default: typical winter/high latitude baseline
            latitude: detectedLocation.latitude,
            showManualLatitude: false
        };

        function setState(updates) {
            state = { ...state, ...updates };
            render();
        }

        function calculateVitaminD() {
            const { age, weight, height, sex, activityLevel, season, weather, outdoorTime, skinTone, sunscreenUse, targetLevel, currentLevel, latitude } = state;
            
            // Calculate BMI (CRITICAL for accurate dosing)
            const bmi = weight / ((height / 100) ** 2);
            
            // RESEARCH-BASED FORMULA
            // Step 1: Base dose from current → target levels
            // Source: "Taking 1000 IU daily raises Vitamin D levels by approximately 12.5 nmol/L"
            // Formula: Base Dose = (Target nmol/L - Current nmol/L) ÷ 12.5 × 1000
            
            let baseDoseNeeded = 0;
            if (targetLevel > currentLevel) {
                const increaseNeeded = targetLevel - currentLevel;
                baseDoseNeeded = (increaseNeeded / 12.5) * 1000;
            } else {
                // Maintenance dose if already at or above target
                baseDoseNeeded = 1000;
            }
            
            // MODIFIERS based on clinical research
            
            // Determine latitude band and season
            const absLat = Math.abs(latitude);
            let latitudeBand;
            if (absLat < 15) latitudeBand = 'equatorial';
            else if (absLat < 35) latitudeBand = 'subtropical';
            else if (absLat < 50) latitudeBand = 'midLatitude';
            else latitudeBand = 'highLatitude';
            
            let adjustedSeason = season;
            if (latitude < 0) {
                const seasonMap = {
                    'winter': 'summer',
                    'summer': 'winter',
                    'spring': 'autumn',
                    'autumn': 'spring'
                };
                adjustedSeason = seasonMap[season];
            }
            
            // MODIFIER 1: BMI (MOST IMPORTANT - Research: 2.6x difference between normal and obese)
            // Research: Ekwaru et al. - Normal weight needs 2,080 IU, Overweight 3,065 IU, Obese 5,473 IU for 100 nmol/L
            // This gives multipliers of: 1.0x, 1.47x, 2.63x
            let bmiMultiplier = 1.0;
            let bmiCategory = '';
            
            if (bmi < 18.5) {
                bmiMultiplier = 0.9;
                bmiCategory = 'underweight';
            } else if (bmi < 25) {
                bmiMultiplier = 1.0;
                bmiCategory = 'normal';
            } else if (bmi < 30) {
                bmiMultiplier = 1.47;
                bmiCategory = 'overweight';
            } else if (bmi < 35) {
                bmiMultiplier = 2.0;
                bmiCategory = 'obese';
            } else {
                bmiMultiplier = 2.6;
                bmiCategory = 'severely obese';
            }
            
            // MODIFIER 2: SKIN TONE (darker skin = reduced synthesis, needs more)
            let skinMultiplier = 1.0;
            switch(skinTone) {
                case 'very_fair':
                case 'fair':
                    skinMultiplier = 1.0;
                    break;
                case 'medium':
                    skinMultiplier = 1.15;
                    break;
                case 'olive':
                    skinMultiplier = 1.25;
                    break;
                case 'brown':
                    skinMultiplier = 1.35;
                    break;
                case 'dark_brown':
                case 'black':
                    skinMultiplier = 1.5;
                    break;
            }
            
            // MODIFIER 3: AGE (older = reduced skin synthesis)
            let ageMultiplier = 1.0;
            if (age < 30) ageMultiplier = 0.95;
            else if (age < 50) ageMultiplier = 1.0;
            else if (age < 70) ageMultiplier = 1.08;
            else ageMultiplier = 1.12;
            
            // MODIFIER 4: SEX (females need more due to hormonal effects + typically higher body fat %)
            // Research shows females need ~10-15% more to reach same levels
            let sexMultiplier = sex === 'female' ? 1.1 : 1.0;
            
            // MODIFIER 5: ACTIVITY LEVEL (minimal effect)
            let activityMultiplier = 1.0;
            switch(activityLevel) {
                case 'sedentary':
                    activityMultiplier = 0.98;
                    break;
                case 'light':
                    activityMultiplier = 1.0;
                    break;
                case 'moderate':
                    activityMultiplier = 1.02;
                    break;
                case 'active':
                    activityMultiplier = 1.05;
                    break;
                case 'very_active':
                    activityMultiplier = 1.08;
                    break;
            }
            
            // Apply all modifiers
            let calculatedDose = baseDoseNeeded * bmiMultiplier * skinMultiplier * ageMultiplier * sexMultiplier * activityMultiplier;
            
            // STEP 9: LIFESTYLE REDUCTIONS (only in spring/summer with actual UVB)
            let lifestyleReductionPercent = 0;
            if ((adjustedSeason === 'summer' || adjustedSeason === 'spring') && latitudeBand !== 'equatorial') {
                // Outdoor time benefit
                switch(outdoorTime) {
                    case '<30min':
                        lifestyleReductionPercent += 0;
                        break;
                    case '30-60':
                        lifestyleReductionPercent += 0.05; // 5% reduction
                        break;
                    case '1-2hrs':
                        lifestyleReductionPercent += 0.10; // 10% reduction
                        break;
                    case '2-4hrs':
                        lifestyleReductionPercent += 0.15; // 15% reduction
                        break;
                    case '4+hrs':
                        lifestyleReductionPercent += 0.20; // 20% reduction
                        break;
                }
                
                // Weather benefit
                switch(weather) {
                    case 'sunny':
                        lifestyleReductionPercent += 0.05;
                        break;
                    case 'mixed':
                        lifestyleReductionPercent += 0.02;
                        break;
                    default:
                        lifestyleReductionPercent += 0;
                }
                
                // Sunscreen penalty (cancels some benefit)
                switch(sunscreenUse) {
                    case 'always':
                        lifestyleReductionPercent -= 0.08; // Blocks synthesis
                        break;
                    case 'usually':
                        lifestyleReductionPercent -= 0.05;
                        break;
                    case 'sometimes':
                        lifestyleReductionPercent -= 0.02;
                        break;
                }
            }
            
            // Apply lifestyle reduction
            calculatedDose *= (1 - lifestyleReductionPercent);
            
            // Round to nearest 100 IU for practical dosing (more precise than 500 IU)
            calculatedDose = Math.round(calculatedDose / 100) * 100;
            
            // Ensure minimum of 1000 IU
            if (calculatedDose < 1000) calculatedDose = 1000;

                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Stack:</strong> ${error.stack}</p>
                </div>
            `;
        }
        
        // Send height to parent for iframe resizing
        function sendHeight() {
            const height = document.documentElement.scrollHeight;
            window.parent.postMessage({ type: 'resize', height: height }, '*');
        }
        
        setTimeout(sendHeight, 100);
        setTimeout(sendHeight, 500);
        setTimeout(sendHeight, 1000);
        
        window.addEventListener('resize', sendHeight);
        
        const observer = new MutationObserver(sendHeight);
        observer.observe(document.body, { 
            childList: true, 
            subtree: true, 
            attributes: true 
        });
    </script>
</body>
</html>
